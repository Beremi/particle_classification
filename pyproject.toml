[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-classification"
version = "0.1.0"
description = "XY-invariant Timepix particle-candidate classification testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
clustering = ["scikit-learn>=1.3", "hdbscan>=0.8"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7.0"]

[project.scripts]
particle-extract-raw = "particle_classification.cli:extract_raw_main"
particle-data-index = "particle_classification.cli:data_index_main"
particle-build-candidates = "particle_classification.cli:build_candidates_main"
particle-tune-dbscan = "particle_classification.cli:tune_dbscan_main"
particle-build-particles = "particle_classification.cli:build_particles_main"
particle-build-edge-training-set = "particle_classification.cli:build_edge_training_set_main"
particle-build-edge-mixed-set = "particle_classification.cli:build_edge_mixed_set_main"
particle-train-edge-tracknet = "particle_classification.cli:train_edge_tracknet_main"
particle-run-edge-experiment = "particle_classification.cli:run_edge_experiment_main"
particle-run-edge-replacement-search = "particle_classification.cli:run_edge_replacement_search_main"
particle-train-baseline = "particle_classification.cli:train_baseline_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
