[build-system]
requires = ["setuptools>=68", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-classification"
version = "0.1.0"
description = "XY-invariant Timepix particle-candidate classification testbed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
clustering = ["scikit-learn>=1.3", "hdbscan>=0.8"]
phase2 = ["scikit-learn>=1.3", "hdbscan>=0.8", "umap-learn>=0.5", "seaborn>=0.13", "plotly>=5.0"]
viz = ["matplotlib>=3.7", "ipython>=8.0", "pillow>=9.0"]
parquet = ["pyarrow>=14"]
speed = ["numba>=0.60", "numpy<2.5"]
dev = ["pytest>=7.0"]

[project.scripts]
particle-extract-raw = "particle_classification.commands.data:extract_raw_main"
particle-raw-archive = "particle_classification.data.archive:main"
particle-data-index = "particle_classification.commands.data:data_index_main"
particle-build-candidates = "particle_classification.commands.data:build_candidates_main"
particle-tune-dbscan = "particle_classification.commands.dbscan:tune_dbscan_main"
particle-build-particles = "particle_classification.commands.dbscan:build_particles_main"
particle-benchmark-clustering = "particle_classification.commands.dbscan:benchmark_clustering_main"
particle-audit-particle-shards = "particle_classification.commands.dbscan:audit_particle_shards_main"
particle-audit-continuity = "particle_classification.commands.dbscan:audit_particle_continuity_main"
particle-build-edge-training-set = "particle_classification.commands.neural_separator:build_edge_training_set_main"
particle-build-edge-mixed-set = "particle_classification.commands.neural_separator:build_edge_mixed_set_main"
particle-build-edge-curriculum-set = "particle_classification.commands.neural_separator:build_edge_curriculum_set_main"
particle-train-edge-tracknet = "particle_classification.commands.neural_separator:train_edge_tracknet_main"
particle-run-edge-experiment = "particle_classification.commands.neural_separator:run_edge_experiment_main"
particle-run-edge-replacement-search = "particle_classification.commands.neural_separator:run_edge_replacement_search_main"
particle-evaluate-phase1 = "particle_classification.commands.neural_separator:evaluate_phase1_main"
particle-build-phase2-dataset = "particle_classification.commands.autoencoders:build_phase2_dataset_main"
particle-train-phase2-sweep = "particle_classification.commands.autoencoders:train_phase2_sweep_main"
particle-evaluate-phase2 = "particle_classification.commands.autoencoders:evaluate_phase2_main"
particle-generate-phase2-report = "particle_classification.commands.autoencoders:generate_phase2_report_main"
particle-train-canonical-voxel-ae = "particle_classification.commands.autoencoders:train_canonical_voxel_ae_main"
particle-render-canonical-voxel-gallery = "particle_classification.commands.autoencoders:render_canonical_voxel_gallery_main"
particle-render-canonical-latent-pairs = "particle_classification.commands.autoencoders:render_canonical_latent_pairs_main"
particle-train-baseline = "particle_classification.commands.baseline:train_baseline_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
